name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/Itoguruma.Server/Itoguruma.Server.csproj
          dotnet restore src/Itoguruma.Cli/Itoguruma.Cli.csproj
          dotnet restore tests/Itoguruma.Tests/Itoguruma.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Itoguruma.Server/Itoguruma.Server.csproj --configuration Release --no-restore
          dotnet build src/Itoguruma.Cli/Itoguruma.Cli.csproj --configuration Release --no-restore
          dotnet build tests/Itoguruma.Tests/Itoguruma.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Itoguruma.Tests/Itoguruma.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
