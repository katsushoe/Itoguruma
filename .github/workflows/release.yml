name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag belongs to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must belong to main." }

      - name: Restore dependencies
        run: dotnet restore tests/Itoguruma.Tests/Itoguruma.Tests.csproj

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build tests/Itoguruma.Tests/Itoguruma.Tests.csproj -c Release --no-restore
          dotnet test tests/Itoguruma.Tests/Itoguruma.Tests.csproj -c Release --no-build

      - name: Build release assets
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assets = @(
            "release/$version/Install-Itoguruma.ps1"
            "release/$version/Itoguruma-$version-win-x64.zip"
            "release/$version/SHA256SUMS.txt"
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "Itoguruma $version" --generate-notes
          }
