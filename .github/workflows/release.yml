name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 0.3.5 or v0.3.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version and main
        id: release
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          $inputVersion = $env:RELEASE_VERSION_INPUT
          $version = $inputVersion.Trim().TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use semantic version format: 0.3.5 or v0.3.5."
          }

          git fetch origin main --tags
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "Checked out commit must match origin/main."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore tests/Itoguruma.Tests/Itoguruma.Tests.csproj

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build tests/Itoguruma.Tests/Itoguruma.Tests.csproj -c Release --no-restore
          dotnet test tests/Itoguruma.Tests/Itoguruma.Tests.csproj -c Release --no-build

      - name: Build release assets
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Ensure release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          git rev-parse --verify --quiet "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne (git rev-parse HEAD)) {
              throw "Release tag $tag already points to a different commit."
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate $tag --message "Itoguruma ${{ steps.release.outputs.version }}"
            git push origin "refs/tags/$tag"
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $assets = @(
            "release/$version/Install-Itoguruma.ps1"
            "release/$version/Itoguruma-$version-win-x64.zip"
            "release/$version/Itoguruma-$version-win-x64.msi"
            "release/$version/SHA256SUMS.txt"
          )
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          $notes = gh api `
            --method POST `
            "repos/${{ github.repository }}/releases/generate-notes" `
            -f "tag_name=$tag" `
            -f "target_commitish=main" `
            --jq .body
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release note generation failed."
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Generated release notes are empty."
          }
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Itoguruma $version" --notes-file $notesPath
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "Itoguruma $version" --notes-file $notesPath
          }
